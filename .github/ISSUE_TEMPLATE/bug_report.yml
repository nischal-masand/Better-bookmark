name: Bug report
description: Something is not working the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: v22.14.0
    validations:
      required: true

  - type: input
    id: chrome
    attributes:
      label: Chrome version
      description: From `chrome://version`.
    validations:
      required: true

  - type: dropdown
    id: extension
    attributes:
      label: Is the companion extension connected?
      description: Settings shows a green dot when it is. Deletes and moves behave differently either way.
      options:
        - Yes, green dot in Settings
        - No, not installed
        - Installed but showing as not connected
        - Not relevant to this bug
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Server output
      description: Anything the terminal running `npm start` printed. Paste it as text, not a screenshot.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: I have checked that any screenshots or logs above do not show bookmarks I would rather keep private.
          required: true
