# Publishes to npm when a version tag is pushed.
#
# Uses npm trusted publishing: npm trusts this workflow directly over OIDC,
# so there is no token to create, store or rotate. It is configured on
# npmjs.com under the package's Settings -> Trusted Publisher -> GitHub
# Actions, with:
#   Organization or user   nischal-masand
#   Repository             Better-bookmark
#   Workflow filename      release.yml
#
# The package has to exist on npm before a trusted publisher can be added,
# so the very first version is published by hand (`npm login`, then
# `npm publish`). Every release after that goes through here.
#
# To release: bump "version" in package.json, commit, then
#   git tag v1.2.3 && git push origin v1.2.3

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1+, newer than what Node 22 bundles.
      - run: npm install -g npm@latest

      - run: npm ci

      # A tag that disagrees with package.json would publish the wrong
      # version under the right name. Refuse rather than guess.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # prepublishOnly runs typecheck, tests, build and the bundle smoke test,
      # so nothing reaches npm that would not pass CI. Provenance is automatic
      # under trusted publishing.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
