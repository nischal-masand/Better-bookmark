<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* Same tokens as the app (web/src/index.css), so the popup reads as part of it. */
      :root {
        color-scheme: dark;
        --surface: #16161c;
        --surface-2: #1e1e26;
        --line: #ffffff1f;
        --ink: #f4f4f6;
        --muted: #9b9ba6;
        --faint: #6b6b78;
        --accent: #5b8cff;
        --ok: #34d399;
        --wait: #f59e0b;
        --bad: #f87171;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --surface: #ffffff;
          --surface-2: #f2f2f5;
          --line: #0f172a1f;
          --ink: #16161a;
          --muted: #55555f;
          --faint: #7a7a86;
          --accent: #3567e8;
          --ok: #059669;
          --wait: #d97706;
          --bad: #dc2626;
        }
      }

      * {
        box-sizing: border-box;
      }
      body {
        width: 272px;
        margin: 0;
        background: var(--surface);
        color: var(--ink);
        font:
          13px/1.45 system-ui,
          'Segoe UI Variable Display',
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 14px 12px;
      }
      header img {
        flex: none;
      }
      h1 {
        margin: 0;
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      #count {
        margin: 0;
        font-size: 11.5px;
        color: var(--faint);
      }

      /* The whole point of the popup: one big, obvious way into the library. */
      #open {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        width: calc(100% - 28px);
        margin: 0 14px 14px;
        padding: 9px 12px;
        border: 0;
        border-radius: 9px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: filter 120ms ease;
      }
      #open:hover {
        filter: brightness(1.1);
      }
      #open:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #open:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        filter: none;
      }

      /* Sync status is secondary: small, muted, one line. */
      footer {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 9px 14px;
        border-top: 1px solid var(--line);
        background: var(--surface-2);
        font-size: 11.5px;
        color: var(--muted);
      }
      .dot {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 99px;
        background: var(--faint);
      }
      .dot.ok {
        background: var(--ok);
      }
      .dot.wait {
        background: var(--wait);
      }
      .dot.bad {
        background: var(--bad);
      }
      #state {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #sync {
        flex: none;
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        font: inherit;
        cursor: pointer;
      }
      #sync:hover {
        text-decoration: underline;
      }
      #sync:disabled {
        color: var(--faint);
        cursor: default;
        text-decoration: none;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/32.png" width="22" height="22" alt="" />
      <div>
        <h1>Better Bookmark</h1>
        <p id="count">Your bookmark library</p>
      </div>
    </header>

    <button id="open" autofocus>
      Open library
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M7 17 17 7M8 7h9v9" />
      </svg>
    </button>

    <footer>
      <span class="dot" id="dot"></span>
      <span id="state">Checking…</span>
      <button id="sync" title="Push waiting changes to Chrome and re-read Chrome's bookmarks">
        Sync now
      </button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
